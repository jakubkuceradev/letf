[project]
name = "letf"
version = "0.1.0"
description = "Analysis pipeline for long-term leveraged ETF allocations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
    "xlrd>=2.0.2",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
